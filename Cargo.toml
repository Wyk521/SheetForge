[package]
name = "sheetforge"
version = "0.1.1"
edition = "2021"
description = "A fast, native Windows GUI for merging Excel and CSV files"
license = "MIT"

[[bin]]
name = "SheetForge"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
calamine = "0.36.1"
csv = "1.3"
eframe = { version = "0.31.1", default-features = false, features = ["accesskit", "default_fonts", "glow"] }
encoding_rs = "0.8"
rfd = "0.15"
rust_xlsxwriter = { version = "0.97.1", features = ["constant_memory"] }
walkdir = "2.5"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
