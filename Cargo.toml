[package]
name = "sheetforge"
version = "0.5.1"
edition = "2021"
description = "A fast, native Windows GUI for merging Excel and CSV files"
license = "MIT"
build = "build.rs"

[[bin]]
name = "SheetForge"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
arboard = "3.4"
calamine = { version = "0.36.1", features = ["dates"] }
csv = "1.3"
encoding_rs = "0.8"
rfd = "0.15"
rust_xlsxwriter = { version = "0.97.1", features = ["constant_memory"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
slint = "1.17.1"
strsim = "0.11"
ureq = { version = "3.1", default-features = false, features = ["rustls"] }
walkdir = "2.5"
webbrowser = "1.0"

[build-dependencies]
slint-build = "1.17.1"
winresource = "0.1.31"

[dev-dependencies]
tempfile = "3.27"

[package.metadata.winresource]
ProductName = "表格合并"
FileDescription = "Excel 和 CSV 表格合并工具"
OriginalFilename = "SheetForge.exe"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
