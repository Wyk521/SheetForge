[package]
name = "sheetforge"
version = "0.2.0"
edition = "2021"
description = "A fast, native Windows GUI for merging Excel and CSV files"
license = "MIT"
build = "build.rs"

[[bin]]
name = "SheetForge"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
calamine = "0.36.1"
csv = "1.3"
encoding_rs = "0.8"
rfd = "0.15"
rust_xlsxwriter = { version = "0.97.1", features = ["constant_memory"] }
slint = "1.17.1"
walkdir = "2.5"

[build-dependencies]
slint-build = "1.17.1"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
