server {
    listen 80;
    listen [::]:80;
    server_name jp.kun.show;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
    }

    location /sheetforge/ {
        return 301 https://$host:8443$request_uri;
    }

    location / {
        return 404;
    }
}

server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    http2 on;
    server_name jp.kun.show;

    ssl_certificate /etc/letsencrypt/live/jp.kun.show/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jp.kun.show/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header X-Content-Type-Options nosniff always;

    location = /sheetforge/latest.json {
        alias /srv/sheetforge-updates/latest.json;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        limit_except GET HEAD { deny all; }
    }

    location /sheetforge/releases/ {
        alias /srv/sheetforge-updates/releases/;
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        limit_except GET HEAD { deny all; }
    }

    location / {
        return 404;
    }
}
