[package]
name = "sheetforge"
version = "0.6.9"
edition = "2021"
description = "A fast, native Windows GUI for merging Excel and CSV files"
license = "MIT"

[[bin]]
name = "SheetForge"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
anyhow = "1.0"
bytes = "1.10"
calamine = { version = "0.36.1", features = ["dates"] }
clap = { version = "4.5", features = ["derive"] }
csv = "1.3"
directories = "6.0"
encoding_rs = "0.8"
futures-util = { version = "0.3", features = ["sink"] }
hex = "0.4"
native-tls = "0.2"
postgres-native-tls = "0.5"
rust_xlsxwriter = { version = "0.97.1", features = ["constant_memory"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
strsim = "0.11"
thiserror = "2.0"
tokio = { version = "1.47", features = ["rt-multi-thread", "sync", "time"] }
tokio-postgres = "0.7"
toml = "0.9"
tracing = "0.1"
ureq = { version = "3.1", default-features = false, features = ["rustls"] }
walkdir = "2.5"

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["sync-secret-service", "crypto-rust"] }

[dev-dependencies]
tempfile = "3.27"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = "symbols"
