[package]
name = "sheetforge"
version = "0.6.2"
edition = "2021"
description = "A fast, native Windows GUI for merging Excel and CSV files"
license = "MIT"

[[bin]]
name = "SheetForge"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
anyhow = "1.0"
calamine = { version = "0.36.1", features = ["dates"] }
csv = "1.3"
encoding_rs = "0.8"
rust_xlsxwriter = { version = "0.97.1", features = ["constant_memory"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
strsim = "0.11"
ureq = { version = "3.1", default-features = false, features = ["rustls"] }
walkdir = "2.5"

[dev-dependencies]
tempfile = "3.27"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = "symbols"
