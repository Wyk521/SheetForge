name: Build Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use stable Rust
        run: rustup default stable

      - name: Test
        run: cargo test

      - name: Build release
        run: cargo build --release

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist\SheetForge-Windows-x64 | Out-Null
          Copy-Item target\release\SheetForge.exe dist\SheetForge-Windows-x64\
          Copy-Item README.md dist\SheetForge-Windows-x64\
          Copy-Item LICENSE dist\SheetForge-Windows-x64\
          Compress-Archive -Path dist\SheetForge-Windows-x64\* -DestinationPath dist\SheetForge-Windows-x64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SheetForge-Windows-x64
          path: dist/SheetForge-Windows-x64.zip
          if-no-files-found: error

      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release create $tag dist\SheetForge-Windows-x64.zip `
            --repo "${{ github.repository }}" `
            --title "SheetForge $tag" `
            --generate-notes `
            --verify-tag

      - name: Publish first release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v0.1.0 --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create v0.1.0 dist\SheetForge-Windows-x64.zip `
              --repo "${{ github.repository }}" `
              --target "${{ github.sha }}" `
              --title "SheetForge v0.1.0" `
              --notes "首个可用版本：支持递归扫描 Excel/CSV、多 Sheet、表头并集/交集/手动映射，以及超过 XLSX 行数上限时自动拆分 Sheet。"
          } else {
            Write-Host "v0.1.0 已存在，跳过重复发布。"
          }
