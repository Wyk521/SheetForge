name: Build Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use stable Rust
        run: rustup default stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Generate dependency lockfile
        run: cargo generate-lockfile

      - name: Format Rust sources
        run: cargo fmt --all

      - name: Upload reproducible sources
        uses: actions/upload-artifact@v7
        with:
          name: Reproducible-sources
          path: |
            Cargo.lock
            src/**/*.rs

      - name: Lint
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Security audit
        shell: pwsh
        run: |
          cargo install cargo-audit --locked
          cargo audit

      - name: Build release
        run: cargo build --release --locked

      - name: Sign executable when certificate is configured
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_BASE64)) {
            Write-Host "未配置签名证书，跳过代码签名"
            exit 0
          }
          $certificate = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          [IO.File]::WriteAllBytes($certificate, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
          & signtool sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /f $certificate /p $env:WINDOWS_CERTIFICATE_PASSWORD target\release\SheetForge.exe
          if ($LASTEXITCODE -ne 0) { throw "代码签名失败" }

      - name: Build installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss
          if ($LASTEXITCODE -ne 0) { throw "安装包构建失败" }
          Copy-Item target\release\SheetForge.exe dist\SheetForge.exe

      - name: Generate SHA256 checksums
        shell: pwsh
        run: |
          Get-ChildItem dist\*.exe | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content -Encoding ascii dist\SHA256SUMS.txt

      - name: Upload Windows package
        uses: actions/upload-artifact@v7
        with:
          name: SheetMerge-Windows-x64
          path: |
            dist/SheetForge.exe
            dist/SheetMerge-Setup.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish release
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $latest = gh api "repos/${{ github.repository }}/commits/main" --jq .sha
          if ("${{ github.ref }}" -eq "refs/heads/main" -and $latest -ne "${{ github.sha }}") {
            Write-Host "main 已有更新提交，跳过旧构建发版"
            exit 0
          }
          if ("${{ github.ref }}" -like "refs/tags/v*") {
            $tag = "${{ github.ref_name }}"
          } else {
            $manifest = Get-Content Cargo.toml -Raw
            if ($manifest -notmatch '(?m)^version\s*=\s*"([^"]+)"') { throw "无法读取版本号" }
            $tag = "v$($Matches[1])"
          }
          $assets = @("dist\SheetForge.exe", "dist\SheetMerge-Setup.exe", "dist\SHA256SUMS.txt")
          gh release view $tag --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag $assets --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "表格合并 $tag" --generate-notes
          } else {
            gh release upload $tag $assets --repo "${{ github.repository }}" --clobber
          }
