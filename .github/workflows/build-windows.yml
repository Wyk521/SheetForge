name: Build Windows

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*"]

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: sheetforge-ci-only
          POSTGRES_DB: sheetforge_dt
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SHEETFORGE_TEST_POSTGRES_PORT: 5432
      SHEETFORGE_TEST_POSTGRES_DATABASE: sheetforge_dt
      SHEETFORGE_TEST_POSTGRES_USER: postgres
      SHEETFORGE_TEST_POSTGRES_PASSWORD: sheetforge-ci-only
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Linux native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev libdbus-1-dev patchelf

      - name: Use stable Rust
        run: rustup default stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Test real PostgreSQL import and rollback
        working-directory: src-tauri
        run: cargo test --locked postgres_integration -- --ignored

  build:
    needs: postgres-integration
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Test frontend
        run: npm test

      - name: Use stable Rust
        run: rustup default stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: false
          workspaces: src-tauri

      - name: Check Rust formatting
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: Upload reproducible sources
        uses: actions/upload-artifact@v7
        with:
          name: Reproducible-sources
          path: |
            src-tauri/Cargo.lock
            src-tauri/src/**/*.rs

      - name: Lint
        working-directory: src-tauri
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        working-directory: src-tauri
        run: cargo test --locked

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Security audit
        working-directory: src-tauri
        run: cargo audit

      - name: Build application
        run: npm run tauri build

      - name: Prepare artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item src-tauri\target\release\SheetForge.exe dist\SheetForge.exe
          $hash = (Get-FileHash dist\SheetForge.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  SheetForge.exe" | Set-Content -Encoding ascii dist\SHA256SUMS.txt

      - name: Sign executables when certificate is configured
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_BASE64)) {
            Write-Host "未配置签名证书，跳过代码签名"
            exit 0
          }
          $certificate = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          [IO.File]::WriteAllBytes($certificate, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
          Get-ChildItem dist\*.exe | ForEach-Object {
            & signtool sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /f $certificate /p $env:WINDOWS_CERTIFICATE_PASSWORD $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "代码签名失败: $($_.Name)" }
          }

      - name: Attest portable executable
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: dist/SheetForge.exe

      - name: Upload Windows package
        uses: actions/upload-artifact@v7
        with:
          name: SheetForge-Windows-x64
          path: dist/*
          if-no-files-found: error

      - name: Publish release
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $latest = gh api "repos/${{ github.repository }}/commits/main" --jq .sha
          if ("${{ github.ref }}" -eq "refs/heads/main" -and $latest -ne "${{ github.sha }}") {
            Write-Host "main 已有更新提交，跳过旧构建发版"
            exit 0
          }
          if ("${{ github.ref }}" -like "refs/tags/v*") {
            $tag = "${{ github.ref_name }}"
          } else {
            $manifest = Get-Content src-tauri\Cargo.toml -Raw
            if ($manifest -notmatch '(?m)^version\s*=\s*"([^"]+)"') { throw "无法读取版本号" }
            $tag = "v$($Matches[1])"
          }
          $assets = @("dist\SheetForge.exe", "dist\SHA256SUMS.txt")
          gh release view $tag --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag $assets --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "表格合并 $tag" --generate-notes
          } else {
            gh release upload $tag $assets --repo "${{ github.repository }}" --clobber
          }
