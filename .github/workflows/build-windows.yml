name: Build Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use stable Rust
        run: rustup default stable

      - name: Test
        run: cargo test

      - name: Build release
        run: cargo build --release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SheetForge-Windows-x64
          path: target/release/SheetForge.exe
          if-no-files-found: error

      - name: Publish release
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ("${{ github.ref }}" -like "refs/tags/v*") {
            $tag = "${{ github.ref_name }}"
          } else {
            $manifest = Get-Content Cargo.toml -Raw
            if ($manifest -notmatch '(?m)^version\s*=\s*"([^"]+)"') {
              throw "无法从 Cargo.toml 读取版本号"
            }
            $tag = "v$($Matches[1])"
          }
          gh release view $tag --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag target\release\SheetForge.exe `
              --repo "${{ github.repository }}" `
              --target "${{ github.sha }}" `
              --title "SheetForge $tag" `
              --generate-notes
          } else {
            gh release upload $tag target\release\SheetForge.exe `
              --repo "${{ github.repository }}" `
              --clobber
          }
